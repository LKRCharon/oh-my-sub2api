# Modified by Oh My Sub2API contributors on 2026-09-15; see CHANGES.md.

name: Release

on:
  push:
    tags: ['v*-ohmy.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.2.5-ohmy.1'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Validate version tag and committed source
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ohmy\.[0-9]+$ ]]
          test "$(cat backend/cmd/server/VERSION)" = "${RELEASE_TAG#v}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set container owner
        id: owner
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "lowercase=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Publish binaries, images, and corresponding source
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.owner.outputs.lowercase }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
