# Modified by Oh My Sub2API contributors on 2026-09-15; see CHANGES.md.

version: 2
project_name: sub2api

builds:
  - id: sub2api
    dir: backend
    main: ./cmd/server
    binary: sub2api
    flags: ['-tags=embed', '-trimpath']
    env: ['CGO_ENABLED=0']
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}} -X main.Date={{.Date}} -X main.BuildType=release

archives:
  - id: default
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - COPYING
      - NOTICE
      - README*.md
      - CHANGES.md
      - deploy/*
      - src: backend/resources
        dst: resources

source:
  enabled: true
  name_template: 'oh-my-sub2api_{{ .Version }}_source'
  format: tar.gz

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

dockers:
  - id: ghcr-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - 'ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/{{ .Env.GITHUB_REPO_NAME }}:{{ .Version }}-amd64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - deploy/docker-entrypoint.sh
      - backend/resources
      - LICENSE
      - COPYING
      - NOTICE
    build_flag_templates:
      - '--platform=linux/amd64'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .Commit }}'
      - '--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}'
  - id: ghcr-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - 'ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/{{ .Env.GITHUB_REPO_NAME }}:{{ .Version }}-arm64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - deploy/docker-entrypoint.sh
      - backend/resources
      - LICENSE
      - COPYING
      - NOTICE
    build_flag_templates:
      - '--platform=linux/arm64'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .Commit }}'
      - '--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}'

docker_manifests:
  - name_template: 'ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/{{ .Env.GITHUB_REPO_NAME }}:{{ .Version }}'
    image_templates:
      - 'ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/{{ .Env.GITHUB_REPO_NAME }}:{{ .Version }}-amd64'
      - 'ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/{{ .Env.GITHUB_REPO_NAME }}:{{ .Version }}-arm64'
  - name_template: 'ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/{{ .Env.GITHUB_REPO_NAME }}:latest'
    image_templates:
      - 'ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/{{ .Env.GITHUB_REPO_NAME }}:{{ .Version }}-amd64'
      - 'ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/{{ .Env.GITHUB_REPO_NAME }}:{{ .Version }}-arm64'

release:
  github:
    owner: '{{ .Env.GITHUB_REPO_OWNER }}'
    name: '{{ .Env.GITHUB_REPO_NAME }}'
  draft: false
  # The suffix identifies this fork's stable revision; /releases/latest must find it.
  prerelease: false
  name_template: 'Oh My Sub2API {{ .Version }}'
  header: |
    Unofficial Sub2API fork with Codex automation compatibility, a resizable sidebar,
    and the Apple Blue theme. See [CHANGES.md](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/blob/{{ .Tag }}/CHANGES.md).
  footer: |
    ## Install

    Container: `ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/{{ .Env.GITHUB_REPO_NAME }}:{{ .Version }}` (Linux amd64 and arm64).
    Binary archives retain the `sub2api` executable name for compatibility.
    Verify downloads against `checksums.txt`.

    ## Corresponding source

    The `oh-my-sub2api_{{ .Version }}_source.tar.gz` asset contains the complete source,
    licenses, and build scripts for these binaries and images.
    [Browse the version tag](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/tree/{{ .Tag }}).
    Licensed under LGPL-3.0-or-later; upstream attribution and disclaimers are retained.
